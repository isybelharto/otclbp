<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password recovery · LBP</title><link rel="stylesheet" href="css/corporate-client.css"></head><body class="auth-body"><main class="auth-shell"><section class="card auth-card"><header><h1>Validating secure recovery</h1><p class="muted">Please wait while your recovery session is verified.</p></header><div style="padding:28px"><p id="status">Checking recovery link…</p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/corporate-client-supabase.js"></script><script>(()=>{const status=document.getElementById("status");LBPCorporate.client.auth.getSession().then(({data})=>{if(data.session)location.replace('reset-password.html'+location.hash);else{const{data:{subscription}}=LBPCorporate.client.auth.onAuthStateChange((e,s)=>{if(s){subscription.unsubscribe();location.replace('reset-password.html')}});setTimeout(()=>status.textContent='This recovery link is invalid or expired.',8000)}});})();</script></body></html>
