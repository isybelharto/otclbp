<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Set new password · LBP</title><link rel="stylesheet" href="css/corporate-client.css"></head><body class="auth-body"><main class="auth-shell"><section class="card auth-card"><header><h1>Set a new password</h1></header><form id="form" class="form-grid"><label><span>New Password</span><input id="password" type="password" required></label><label><span>Confirm Password</span><input id="confirmation" type="password" required></label><button class="btn btn-primary full">Update Password</button><p id="status" class="status full"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/corporate-client-supabase.js"></script><script>(()=>{const form=document.getElementById("form");const password=document.getElementById("password");const confirmation=document.getElementById("confirmation");const status=document.getElementById("status");form.onsubmit=async e=>{e.preventDefault();const x=LBPCorporate.passwordErrors(password.value,confirmation.value);if(x.length){status.textContent=x[0];status.className='status error';return}const{error}=await LBPCorporate.client.auth.updateUser({password:password.value});if(error){status.textContent=error.message;status.className='status error'}else{await LBPCorporate.client.auth.signOut();status.textContent='Password updated. Redirecting…';setTimeout(()=>location.href='login.html',1000)}};})();</script></body></html>
