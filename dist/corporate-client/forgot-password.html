<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recover access · LBP Corporate Client</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="css/corporate-client.css"></head><body class="auth-body"><main class="auth-shell"><div class="brand"><img src="assets/lbp-crypto-fiat-logo.png"><div><strong>PT LINTAS BATAS PEMBAYARAN</strong><small>CORPORATE CLIENT ACCESS RECOVERY</small></div></div><section class="card auth-card"><header><h1>Recover account access</h1><p class="muted">Your User ID is your registered company email. Enter it to receive a secure password-reset link.</p></header><form id="form" class="form-grid"><label class="full"><span>User ID / Company Email</span><input id="email" type="email" required></label><button class="btn btn-primary full">Send Reset Email</button><p id="status" class="status full"></p></form><footer><a href="login.html">Return to sign in</a></footer></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/corporate-client-supabase.js"></script><script>(()=>{const form=document.getElementById("form");const email=document.getElementById("email");const status=document.getElementById("status");form.onsubmit=async e=>{e.preventDefault();try{await LBPCorporate.reset(email.value);status.textContent='If this User ID exists, a reset email has been sent.';status.className='status success'}catch(x){status.textContent=x.message;status.className='status error'}};})();</script></body></html>
