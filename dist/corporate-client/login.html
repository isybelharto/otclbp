<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LBP Corporate Client Access</title><link rel="icon" href="assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/corporate-client.css"></head><body class="auth-body"><main class="auth-shell"><div class="brand"><img src="assets/lbp-crypto-fiat-logo.png"><div><strong>PT LINTAS BATAS PEMBAYARAN</strong><small>CORPORATE CLIENT PORTAL</small></div></div><section class="card auth-card"><header><span class="eyebrow">Secure institutional access</span><h1>Sign in to Corporate Client</h1><p class="muted">Use your registered User ID (company email) and password.</p></header><form id="form" class="form-grid"><label class="full"><span>User ID / Company Email</span><input id="email" type="email" autocomplete="username" required></label><label class="full"><span>Password</span><input id="password" type="password" autocomplete="current-password" required></label><button class="btn btn-primary full">Sign In</button><p id="status" class="status full"></p></form><footer><a href="forgot-password.html">Forgot password or User ID?</a> · New client? <a href="register.html">Register first</a></footer></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/corporate-client-supabase.js"></script><script>(()=>{const form=document.getElementById("form");const email=document.getElementById("email");const password=document.getElementById("password");const status=document.getElementById("status");form.onsubmit=async e=>{e.preventDefault();status.textContent='Checking access…';const{error}=await LBPCorporate.client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){status.textContent='Incorrect User ID or password.';status.className='status error';return}if(await LBPCorporate.profile())location.replace('./');else{await LBPCorporate.client.auth.signOut();status.textContent='Corporate Client access is not active.';status.className='status error'}};})();</script></body></html>
