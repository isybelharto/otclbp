<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New Password · LBP Partner Desk</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/partner-desk.css?v=20261027-manrope"><link rel="stylesheet" href="css/partner-brand.css?v=20261027-manrope"></head><body class="partner-auth-body"><main class="partner-auth-shell"><section class="partner-auth-brand"><img class="partner-brand-logo" src="../management/assets/lbp-crypto-fiat-logo.png" alt="PT Lintas Batas Pembayaran"><div><strong>PT LINTAS BATAS PEMBAYARAN</strong><small>SET NEW PASSWORD</small></div></section><section class="partner-card partner-auth-card"><header class="partner-card-head"><div><span class="partner-eyebrow">Password recovery</span><h1>Create a new password</h1><p>Use a unique institutional password that meets every requirement.</p></div></header><form id="new-password-form" class="partner-auth-form"><label>New Password<input id="new-password" type="password" required autocomplete="new-password"></label><label>Confirm New Password<input id="new-password-confirm" type="password" required autocomplete="new-password"></label><div class="password-requirements"><span data-rule="length">At least 8 characters</span><span data-rule="capital">One capital letter</span><span data-rule="special">One special character</span><span data-rule="repeat">No character repeated 3 times</span><span data-rule="match">Passwords match</span></div><button class="partner-config-save" type="submit">Update password</button><p id="new-password-status" class="partner-auth-status" role="status"></p></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/partner-desk-supabase.js?v=20261027-partner-access-refresh"></script><script>const password=document.querySelector('#new-password'),confirmation=document.querySelector('#new-password-confirm'),status=document.querySelector('#new-password-status');function showRules(){const value=password.value,confirm=confirmation.value,rules={length:value.length>=8,capital:/[A-Z]/.test(value),special:/[^A-Za-z0-9]/.test(value),repeat:!/(.)\1\1/i.test(value),match:value.length>0&&value===confirm};Object.entries(rules).forEach(([key,valid])=>document.querySelector(`[data-rule="${key}"]`).classList.toggle('valid',valid))}password.oninput=showRules;confirmation.oninput=showRules;document.querySelector('#new-password-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;try{await window.LBPPartnerDeskSupabase.updatePassword(password.value,confirmation.value);status.textContent='Password updated. You can now return to sign in.';status.className='partner-auth-status success';setTimeout(()=>location.replace('login.html'),1600)}catch(error){status.textContent=error.message||'Password could not be updated.';status.className='partner-auth-status error'}finally{button.disabled=false}});</script></body></html>
