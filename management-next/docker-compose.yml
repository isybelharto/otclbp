services:
  management:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      # Caddy is the only public entrypoint. The app is reachable only from
      # this VPS, at 127.0.0.1:3000.
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
